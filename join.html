<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الانضمام لإدارة El Madina Center</title><style>body{margin:0;background:#f7f5ef;font-family:Tahoma,Arial;color:#202825}.card{max-width:460px;margin:55px auto;background:#fff;padding:22px;border-radius:22px;box-shadow:0 10px 30px #173f3520}.grid{display:grid;gap:10px}input,button{font:inherit;padding:11px;border-radius:11px;border:1px solid #ddd}button{background:#173f35;color:#fff;font-weight:800;border:0}.small{font-size:13px;color:#707a76}.ok{color:#17633b}.err{color:#b33a3a}</style></head><body><section class=card><h2>👥 الانضمام إلى El Madina Center</h2><p class=small>هذه الصفحة للمستخدم الذي اعتمده صاحب المتجر. أنشئ حسابك هنا ثم افتح لوحة الإدارة.</p><form id=f class=grid><input id=e type=email required placeholder="البريد الإلكتروني"><input id=p type=password minlength=6 required placeholder="كلمة المرور"><input id=p2 type=password minlength=6 required placeholder="تأكيد كلمة المرور"><button>إنشاء الحساب</button><div id=m class=small></div></form></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const s=window.supabase.createClient(window.ELMADINA_SUPABASE_URL,window.ELMADINA_SUPABASE_ANON_KEY),q=new URLSearchParams(location.search);if(q.get('email'))e.value=q.get('email');f.onsubmit=async x=>{x.preventDefault();m.className='small';m.textContent='جارٍ إنشاء الحساب...';if(p.value!==p2.value){m.textContent='كلمتا المرور غير متطابقتين.';m.className='small err';return}try{const r=await s.auth.signUp({email:e.value.trim().toLowerCase(),password:p.value});if(r.error)throw r.error;await s.rpc('claim_staff_account');m.textContent='تم إنشاء الحساب بنجاح. يمكنك الآن فتح لوحة الإدارة.';m.className='small ok'}catch(err){m.textContent='خطأ: '+err.message;m.className='small err'}}</script></body></html>
